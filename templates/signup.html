{% extends "base.html" %}
{% block title %}Sign Up - AI Resume Analyzer{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="sub-text">Start your AI-powered career journey</p>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('signup') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" minlength="6" required>
                <small style="color: var(--text-secondary);">Use at least 6 characters</small>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p class="switch-auth">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
